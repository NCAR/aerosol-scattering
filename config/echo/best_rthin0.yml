data:
  batch_size: 1012
  cond_args:
    in_bias_arr: 0
    in_norm_arr: 1
    out_bias_arr: 0
    out_norm_arr: 1
  data_file: hippo_aerosol_training_data_train.nc
  data_path: /glade/derecho/scratch/mhayman/aerosol/datasets/
  input_cols: []
  output_cols:
  - number_concentration
  - mean_r
  test_data_file: hippo_aerosol_training_data_test.nc
  test_data_path: /glade/derecho/scratch/mhayman/aerosol/datasets/
  test_fraction: 0.05
  train_fraction: 0.7
  valid_data_file: hippo_aerosol_training_data_valid.nc
  valid_data_path: /glade/derecho/scratch/mhayman/aerosol/datasets/
  valid_fraction: 0.25
  wavelength_inputs:
    backscatter_coefficient:
      wavelength_lst:
      - 1.064e-06
      - 5.32e-07
      - 3.55e-07
    extinction_coefficient:
      wavelength_lst:
      - 1.064e-06
      - 5.32e-07
      - 3.55e-07
model:
  dtype: float64
  int_count: 1000
  layer_count: 11
  layer_nodes: 2892
  polynomial_order_1: 35
  polynomial_order_2: 26
save_loc: /glade/derecho/scratch/mhayman/aerosol_poly_nn/valid_echo
trainer:
  amp: false
  batches_per_epoch: 512
  grad_accum_every: 1
  learning_rate: 0.0002083692051794976
  max_epochs: 1500
  scheduler:
    factor: 0.1
    min_lr: 1.0e-08
    patience: 100
    threshold: 0.0005932110152950345
  stopping_patience: 6
  valid_batches_per_epoch: 256
