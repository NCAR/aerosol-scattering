log: True
save_path: "/glade/derecho/scratch/mhayman/aerosol_poly_nn/beta6_alpha2_r_eff_13_02/"
notes: "6 backscatter, 2 extinction with effective radius and number density estimates.  index of refraction 1.3+0.02i"

pbs:
  jobs: 8
  tasks_per_worker: 1
  # gpus_per_node: 1
  bash: [
      "module load conda",
      "conda activate holodec"
        ]
  batch:
    N: "echo-polynn"
    l: ["select=1:ncpus=8:ngpus=1:mem=128GB:gpu_type=v100", "walltime=12:00:00"]
    A: "NEOL0007" # HOLODEC allocation "NAIML0011"# "NEOL0007"
    q: "casper"
    o: "out"
    e: "out"

optuna:
  storage: "study.db"
  study_name: "polynn"
  storage_type: "nfs"
  objective: "/glade/u/home/mhayman/Python/aerosol-scattering/scripts/casper/trainer_polynn.py"
  direction: "minimize"
  metric: "valid_loss"
  n_trials: 200
  gpu: True
  sampler:
    type: "TPESampler"
    n_startup_trials: 100
  parameters:
    trainer:learning_rate:
      type: "loguniform"
      settings:
        name: "learning_rate"
        low: 5.0e-05
        high: 1.0e-02
    trainer:scheduler:threshold:
      type: "loguniform"
      settings:
        name: "threshold"
        low: 1.0e-05
        high: 1.0e-02
    data:batch_size:
      type: "int" 
      settings:
        name: "batch_size"
        low: 128
        high: 1024
    model:layer_count:
      type: "int" 
      settings:
        name: "layer_count"
        low: 2
        high: 12
    model:layer_nodes:
      type: "int" 
      settings:
        name: "layer_nodes"
        low: 128
        high: 4096    
    model:polynomial_order_1:
      type: "int" 
      settings:
        name: "polynomial_order_1"
        low: 2
        high: 40
    model:polynomial_order_2:
      type: "int" 
      settings:
        name: "polynomial_order_2"
        low: 2
        high: 40
